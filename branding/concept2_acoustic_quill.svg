<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="100%" height="100%" fill="none">
  <!-- Concept 2: The Acoustic Quill (Soundwave-to-Nib Icon + Wordmark) -->
  <style>
    .brand-text {
      font-family: 'Instrument Serif', 'Times New Roman', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 48px;
      fill: currentColor;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      fill: currentColor;
    }
    .brand-line {
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- 1. The Acoustic Quill Icon Mark (Soundwave converging into Pen Nib) -->
  <g transform="translate(12, 14)">
    <!-- Dynamic sound amplitude bars transitioning into a pen nib structure -->
    <!-- Sound bar 1 (Outer left) -->
    <line x1="6" y1="20" x2="6" y2="32" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Sound bar 2 (Inner left) -->
    <line x1="14" y1="14" x2="14" y2="38" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Center Quill Nib Body -->
    <path d="M26 4 L38 24 L38 42 L26 50 L14 42 L14 24 Z" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Nib Center Slit & Acoustic Aperture -->
    <line x1="26" y1="10" x2="26" y2="34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="26" cy="34" r="2.2" fill="currentColor" />
    
    <!-- Sound bar 3 (Inner right) -->
    <line x1="38" y1="14" x2="38" y2="38" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Sound bar 4 (Outer right) -->
    <line x1="46" y1="20" x2="46" y2="32" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <!-- 2. Wordmark Lockup -->
  <g transform="translate(78, 54)">
    <text x="0" y="0" class="brand-text">LectureScribe</text>
    <circle cx="282" cy="-30" r="3" fill="currentColor" />
  </g>
</svg>
