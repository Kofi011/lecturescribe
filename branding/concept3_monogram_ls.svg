<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 80" width="100%" height="100%" fill="none">
  <!-- Concept 3: The Harmonic Monogram (Interlocking 'LS' Acoustic Glyph + Wordmark) -->
  <style>
    .monogram-text {
      font-family: 'Instrument Serif', 'Times New Roman', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 48px;
      fill: currentColor;
      letter-spacing: -0.02em;
    }
  </style>

  <!-- 1. Interlocking LS Monogram Mark inside sleek squircle frame -->
  <g transform="translate(10, 12)">
    <!-- Rounded Squircle Badge Frame -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="none" stroke="currentColor" stroke-width="2.5" />
    
    <!-- Stylized 'L' Form (Left Stem & Horizontal Sweep) -->
    <path d="M18 14 L18 38 C18 41 20 43 23 43 L32 43" 
          stroke="currentColor" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Stylized 'S' Form (Interlocking Harmonic Wave S) -->
    <path d="M38 18 C35 15 28 15 28 22 C28 29 39 29 39 36 C39 42 32 42 27 40" 
          stroke="currentColor" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- 2. Wordmark Lockup -->
  <g transform="translate(82, 54)">
    <text x="0" y="0" class="monogram-text">LectureScribe</text>
    <!-- Minimal Geometric Accent -->
    <rect x="282" y="-32" width="6" height="6" rx="3" fill="currentColor" />
  </g>
</svg>
