<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 80" width="100%" height="100%" fill="none">
  <!-- Concept 5: The Continuous Scribe Ribbon (Fluid Acoustic Infinity & S-Glyph) -->
  <style>
    .ribbon-text {
      font-family: 'Instrument Serif', 'Times New Roman', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 48px;
      fill: currentColor;
      letter-spacing: -0.02em;
    }
  </style>

  <!-- 1. The Continuous Scribe Ribbon Mark -->
  <g transform="translate(14, 12)">
    <!-- Fluid calligraphic infinite resonance loop -->
    <path d="M12 40 C6 30 6 18 16 12 C28 5 36 22 24 34 C16 42 22 50 34 46 C44 42 46 28 38 18" 
          stroke="currentColor" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Dynamic terminal dot -->
    <circle cx="12" cy="40" r="3" fill="currentColor" />
    <circle cx="38" cy="18" r="2.5" fill="currentColor" />
  </g>

  <!-- 2. Wordmark Lockup -->
  <g transform="translate(80, 54)">
    <text x="0" y="0" class="ribbon-text">LectureScribe</text>
    <path d="M280 -28 L286 -28 L286 -34" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
