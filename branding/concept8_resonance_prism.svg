<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 80" width="100%" height="100%" fill="none">
  <!-- Concept 8: The Resonance Prism (Dual Acoustic Lens & Optical Mark + Wordmark) -->
  <style>
    .prism-text {
      font-family: 'Instrument Serif', 'Times New Roman', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 48px;
      fill: currentColor;
      letter-spacing: -0.02em;
    }
  </style>

  <!-- 1. The Resonance Prism Mark (Intersecting Acoustic Lenses) -->
  <g transform="translate(16, 14)">
    <!-- Solid Left Arc Lens -->
    <path d="M12 8 C26 14 26 38 12 44 C20 44 32 36 32 26 C32 16 20 8 12 8 Z" fill="currentColor" />
    <!-- Outlined Right Arc Lens (Echo) -->
    <path d="M26 4 C42 12 42 40 26 48 C36 48 50 38 50 26 C50 14 36 4 26 4 Z" fill="currentColor" opacity="0.35" />
    <!-- Dynamic Focal Core -->
    <circle cx="26" cy="26" r="3" fill="currentColor" />
  </g>

  <!-- 2. Wordmark Lockup -->
  <g transform="translate(86, 54)">
    <text x="0" y="0" class="prism-text">LectureScribe</text>
    <!-- Geometric Accent -->
    <path d="M280 -28 L286 -22 L280 -16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
